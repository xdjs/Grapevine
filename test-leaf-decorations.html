<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaf Decorations Test</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
        }
        .test-container {
            border: 1px solid #333;
            padding: 20px;
            margin-bottom: 20px;
        }
        svg {
            border: 1px solid #555;
            background: #111;
        }
        .leaf-decoration {
            pointer-events: auto;
        }
        .leaf {
            transition: all 0.2s ease-in-out;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }
        .leaf:hover {
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5));
            transform: scale(1.1);
        }
        .leaf-shape {
            transition: all 0.2s ease-in-out;
        }
        .leaf:hover .leaf-shape {
            filter: brightness(1.2);
        }
    </style>
</head>
<body>
    <h1>🌿 Leaf Decorations Test</h1>
    
    <div class="test-container">
        <h3>Simple Connection with Leaves</h3>
        <svg id="simple-test" width="400" height="200"></svg>
    </div>

    <div class="test-container">
        <h3>Multiple Connections with Leaves</h3>
        <svg id="multiple-test" width="600" height="400"></svg>
    </div>

    <script>
        // Test 1: Simple connection with leaves
        function testSimpleConnection() {
            const svg = d3.select("#simple-test");
            const networkGroup = svg.append("g").attr("class", "network-group");
            
            // Create a simple connection line
            const link = networkGroup.append("line")
                .attr("class", "link")
                .attr("x1", 50)
                .attr("y1", 100)
                .attr("x2", 350)
                .attr("y2", 100)
                .attr("stroke", "#355367")
                .attr("stroke-width", 2);
            
            // Create leaf decorations
            const leafDecoration = networkGroup.append("g")
                .attr("class", "leaf-decoration");
            
            const leafPositions = [0.25, 0.75];
            
            leafPositions.forEach((position, index) => {
                const leafGroup = leafDecoration.append("g")
                    .attr("class", "leaf")
                    .attr("data-leaf-index", index)
                    .style("cursor", "pointer")
                    .on("click", (event) => {
                        event.stopPropagation();
                        console.log(`Leaf ${index} clicked!`);
                        alert(`Leaf ${index} clicked!`);
                    });
                
                // Create leaf shape
                const leafPath = leafGroup.append("path")
                    .attr("class", "leaf-shape")
                    .attr("d", "M0,0 Q-6,-3 -10,0 Q-6,3 0,0")
                    .attr("fill", "#4ade80")
                    .attr("stroke", "#22c55e")
                    .attr("stroke-width", 1.5)
                    .attr("opacity", 0.9);
                
                // Position the leaf
                const x = 50 + (350 - 50) * position;
                const y = 100;
                const leafAngle = index === 0 ? 90 : -90; // Perpendicular to line
                
                leafGroup.attr("transform", `translate(${x}, ${y}) rotate(${leafAngle})`);
            });
        }
        
        // Test 2: Multiple connections with leaves
        function testMultipleConnections() {
            const svg = d3.select("#multiple-test");
            const networkGroup = svg.append("g").attr("class", "network-group");
            
            // Create multiple connection lines
            const connections = [
                { x1: 100, y1: 100, x2: 300, y2: 100 },
                { x1: 100, y1: 200, x2: 300, y2: 200 },
                { x1: 100, y1: 300, x2: 300, y2: 300 }
            ];
            
            connections.forEach((conn, connIndex) => {
                // Create connection line
                const link = networkGroup.append("line")
                    .attr("class", "link")
                    .attr("x1", conn.x1)
                    .attr("y1", conn.y1)
                    .attr("x2", conn.x2)
                    .attr("y2", conn.y2)
                    .attr("stroke", "#355367")
                    .attr("stroke-width", 2);
                
                // Create leaf decorations
                const leafDecoration = networkGroup.append("g")
                    .attr("class", "leaf-decoration");
                
                const leafPositions = [0.25, 0.75];
                
                leafPositions.forEach((position, index) => {
                    const leafGroup = leafDecoration.append("g")
                        .attr("class", "leaf")
                        .attr("data-leaf-index", index)
                        .style("cursor", "pointer")
                        .on("click", (event) => {
                            event.stopPropagation();
                            console.log(`Connection ${connIndex}, Leaf ${index} clicked!`);
                            alert(`Connection ${connIndex}, Leaf ${index} clicked!`);
                        });
                    
                    // Create leaf shape
                    const leafPath = leafGroup.append("path")
                        .attr("class", "leaf-shape")
                        .attr("d", "M0,0 Q-6,-3 -10,0 Q-6,3 0,0")
                        .attr("fill", "#4ade80")
                        .attr("stroke", "#22c55e")
                        .attr("stroke-width", 1.5)
                        .attr("opacity", 0.9);
                    
                    // Position the leaf
                    const x = conn.x1 + (conn.x2 - conn.x1) * position;
                    const y = conn.y1;
                    const leafAngle = index === 0 ? 90 : -90; // Perpendicular to line
                    
                    leafGroup.attr("transform", `translate(${x}, ${y}) rotate(${leafAngle})`);
                });
            });
        }
        
        // Run tests
        testSimpleConnection();
        testMultipleConnections();
        
        console.log("🌿 Leaf decorations test loaded successfully!");
    </script>
</body>
</html>
